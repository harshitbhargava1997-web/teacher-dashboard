name: Daily OneLern Multi-Consultant Sync

on:
  schedule:
    # Runs everyday at 12:00 AM IST (18:30 UTC)
    - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  multi-consultant-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas numpy openpyxl pyarrow supabase
          python -m playwright install chromium

      - name: 🚀 Execute Chromium Ingestion
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          CONSULTANTS_JSON: ${{ secrets.CONSULTANTS_JSON }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python -u sync_portal.py

      - name: Upload Debug Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-debug-screenshots
          path: debug_screenshots/
          if-no-files-found: ignore
