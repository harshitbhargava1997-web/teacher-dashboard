name: Daily OneLern Multi-Consultant Sync

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  multi-consultant-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies & Playwright Chromium
        run: |
          pip install --upgrade pip
          pip install playwright pandas numpy openpyxl pyarrow supabase
          python -m playwright install --with-deps chromium

      - name: 🚀 Execute Multi-Consultant Ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          CONSULTANTS_JSON: ${{ secrets.CONSULTANTS_JSON }}
        run: |
          python sync_portal.py

      - name: Upload Debug Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-debug-screenshots
          path: debug_screenshots/
          if-no-files-found: ignore
